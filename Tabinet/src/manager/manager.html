<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabinet — Manage groups</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===== left: group list (Safari-style sidebar) ===== -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand">
            <img class="brand-icon" src="../../icons/icon48.png" alt="" />
            <h1 class="title">Tabinet</h1>
          </div>
          <button id="new-group-btn" class="btn primary block" type="button">
            + New group
          </button>
        </div>

        <ul id="group-list" class="group-list" aria-label="Tab groups">
          <!-- rendered by manager.js -->
        </ul>

        <div class="sidebar-foot">
          <label
            class="sync-toggle"
            title="Sync groups to your Google account so they appear on every device you're signed into (small storage limit — see README)."
          >
            <input id="sync-toggle" type="checkbox" />
            Sync across devices
          </label>
          <label
            class="sync-toggle"
            title="On: the workspace you leave keeps running as a Chrome tab group, so switching back is instant — but Chrome lists every live tab group in the bookmarks bar. Off: Tabinet never creates tab groups, so nothing appears in the bookmarks bar; workspaces reopen (pre-warmed) when you switch back. Individual workspaces can override this."
          >
            <input id="keep-loaded-toggle" type="checkbox" />
            Keep workspaces live in the background
          </label>
          <label
            class="sync-toggle"
            title="On: when a workspace opens, Tabinet loads its tabs in the background a few at a time, so clicking a tab shows an already-loaded page instead of waiting for it. Off: tabs stay unloaded until you click them (lighter on memory), and are only network-warmed."
          >
            <input id="preload-toggle" type="checkbox" />
            Pre-load tabs when a workspace opens
          </label>
          <p class="foot-hint">
            Chrome's own bookmarks bar row can be hidden entirely: right-click
            the bookmarks bar and uncheck <b>Show tab groups</b>.
          </p>
          <div class="io-row">
            <select id="import-mode" title="How Load JSON applies the file">
              <option value="merge">Merge</option>
              <option value="replace">Replace all</option>
            </select>
            <button id="import-btn" class="btn small" type="button">Load</button>
            <button id="export-btn" class="btn small" type="button">Save</button>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>
        </div>
      </aside>

      <!-- ===== right: selected group's tabs ===== -->
      <main id="detail" class="detail">
        <!-- rendered by manager.js -->
      </main>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <script type="module" src="manager.js"></script>
  </body>
</html>
