<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabinet</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===== left: group list (Safari-style sidebar) ===== -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand">
            <img class="brand-icon" src="../../icons/icon48.png" alt="" />
            <h1 class="title">Tabinet</h1>
          </div>
          <button id="new-group-btn" class="btn primary block" type="button" data-i18n="mgNewGroup"></button>
        </div>

        <ul id="group-list" class="group-list" data-i18n-aria-label="mgGroupListLabel">
          <!-- rendered by manager.js -->
        </ul>

        <div class="sidebar-foot">
          <label class="sync-toggle" data-i18n-title="mgSyncTitle">
            <input id="sync-toggle" type="checkbox" />
            <span data-i18n="mgSync"></span>
          </label>
          <label class="sync-toggle" data-i18n-title="mgKeepLiveTitle">
            <input id="keep-loaded-toggle" type="checkbox" />
            <span data-i18n="mgKeepLive"></span>
          </label>
          <label class="sync-toggle" data-i18n-title="mgPreloadTitle">
            <input id="preload-toggle" type="checkbox" />
            <span data-i18n="mgPreload"></span>
          </label>
          <label class="sync-toggle" data-i18n-title="mgAutoSaveChangesTitle">
            <input id="autosave-changes-toggle" type="checkbox" />
            <span data-i18n="mgAutoSaveChanges"></span>
          </label>
          <label class="sync-toggle" data-i18n-title="mgAutoSaveCountTitle">
            <input id="autosave-count-toggle" type="checkbox" />
            <span data-i18n="mgAutoSaveCount"></span>
          </label>
          <p class="foot-hint" data-i18n-html="mgBookmarksHint"></p>
          <div class="io-row">
            <select id="import-mode" data-i18n-title="mgImportModeTitle">
              <option value="merge" data-i18n="mgMerge"></option>
              <option value="replace" data-i18n="mgReplaceAll"></option>
            </select>
            <button id="import-btn" class="btn small" type="button" data-i18n="mgLoad"></button>
            <button id="export-btn" class="btn small" type="button" data-i18n="mgSave"></button>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>
          <div class="io-row">
            <label class="lang-label" for="language-select" data-i18n="languageLabel"></label>
            <select id="language-select"></select>
          </div>
          <a id="about-link" class="about-link" href="../about/about.html" target="_blank"></a>
        </div>
      </aside>

      <!-- ===== right: selected group's tabs ===== -->
      <main id="detail" class="detail">
        <!-- rendered by manager.js -->
      </main>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <script type="module" src="manager.js"></script>
  </body>
</html>
