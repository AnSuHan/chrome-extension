<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabinet</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <img class="brand-icon" src="../../icons/icon48.png" alt="" />
      <h1 class="logo">Tabinet</h1>
      <button id="new-group-btn" class="icon-ghost" type="button" data-i18n-title="spNewGroupTitle">
        &#43;
      </button>
      <button id="editor-btn" class="icon-ghost" type="button" data-i18n-title="spOpenEditorTitle">
        &#9998;
      </button>
      <button id="about-btn" class="icon-ghost" type="button" data-i18n-title="aboutOpenTitle">
        &#9432;
      </button>
    </header>

    <p id="toast" class="toast" role="status" hidden></p>

    <!-- One-time hint: the side panel's left/right position is a Chrome setting,
         not something the extension can control via the sidePanel API. -->
    <div id="dock-hint" class="dock-hint" hidden>
      <span class="dock-hint-ic">&#128161;</span>
      <span class="dock-hint-text" data-i18n-html="spDockHint"></span>
      <button
        id="dock-hint-close"
        class="dock-hint-close"
        type="button"
        data-i18n-title="dismiss"
        data-i18n-aria-label="spDismissHint"
      >
        &times;
      </button>
    </div>

    <main class="scroll">
      <!-- Live tabs of the current window (Safari-style sidebar) -->
      <section class="section" id="open-section">
        <div class="section-head">
          <span class="section-label" data-i18n="spOpenTabs"></span>
          <span id="open-count" class="section-count">0</span>
          <button id="new-tab-btn" class="icon-ghost icon-ghost--sm" type="button" data-i18n-title="newTab">
            &#43;
          </button>
        </div>
        <!-- Shows which saved group these open tabs currently belong to. -->
        <div id="active-badge" class="active-badge" hidden></div>
        <ul id="open-list" class="open-list">
          <!-- rendered by sidepanel.js -->
        </ul>
      </section>

      <!-- Saved tab groups -->
      <section class="section" id="saved-section">
        <div class="section-head">
          <span class="section-label" data-i18n="spSavedGroups"></span>
        </div>

        <div class="actions">
          <button id="save-window-btn" class="btn btn--primary" type="button">
            <span class="ic">&#9633;</span> <span data-i18n="spSaveWindow"></span>
          </button>
          <button
            id="save-group-btn"
            class="btn"
            type="button"
            data-i18n-title="spSaveGroupTitle"
          >
            <span class="ic">&#9707;</span> <span data-i18n="spSaveGroup"></span>
          </button>
        </div>

        <ul id="group-list" class="group-list">
          <!-- rendered by sidepanel.js -->
        </ul>
        <div id="empty" class="empty" hidden>
          <div class="empty-icon">&#128194;</div>
          <p class="empty-title" data-i18n="spEmptyTitle"></p>
          <p class="empty-sub" data-i18n="spEmptySub"></p>
        </div>
      </section>
    </main>

    <!-- Right-click menu for the open-tabs list -->
    <div id="ctx-menu" class="ctx-menu" hidden>
      <button class="ctx-item" type="button" data-act="new" data-i18n="newTab"></button>
      <button class="ctx-item" type="button" data-act="duplicate" data-i18n="spDuplicateTab"></button>
      <button class="ctx-item ctx-item--danger" type="button" data-act="close" data-i18n="closeTab"></button>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
