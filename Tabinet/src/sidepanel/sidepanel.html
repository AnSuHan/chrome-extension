<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabinet</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <img class="brand-icon" src="../../icons/icon48.png" alt="" />
      <h1 class="logo">Tabinet</h1>
      <button id="new-group-btn" class="icon-ghost" type="button" title="New empty group">
        &#43;
      </button>
      <button id="editor-btn" class="icon-ghost" type="button" title="Open full editor">
        &#9998;
      </button>
    </header>

    <div class="actions">
      <button id="save-window-btn" class="btn btn--primary" type="button">
        <span class="ic">&#9633;</span> Save window
      </button>
      <button
        id="save-group-btn"
        class="btn"
        type="button"
        title="Save the tab group the active tab belongs to"
      >
        <span class="ic">&#9707;</span> Save group
      </button>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <main class="scroll">
      <ul id="group-list" class="group-list">
        <!-- rendered by sidepanel.js -->
      </ul>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon">&#128194;</div>
        <p class="empty-title">No saved groups yet</p>
        <p class="empty-sub">
          Save the current window or tab group to get started.
        </p>
      </div>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
