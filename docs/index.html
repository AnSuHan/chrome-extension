<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chrome extensions — AnSuHan</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#616a75; --line:#e3e6ea; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e8eb; --muted:#9aa1ac; --line:#2a2e35; --accent:#6ea8fe; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:64px 22px; }
  h1 { font-size:28px; margin:0 0 8px; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:0 0 36px; }
  h2 { font-size:19px; margin:32px 0 6px; }
  ul { padding-left:20px; } li { margin:5px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Chrome extensions</h1>
  <p class="sub">Supporting pages for the extensions in
    <a href="https://github.com/AnSuHan/chrome-extension">AnSuHan/chrome-extension</a>.</p>

  <h2>Tabinet</h2>
  <p>Group, save, and restore your tabs — Safari-style tab groups for Chrome.</p>
  <ul>
    <li><a href="tabinet/privacy.html">Privacy policy</a></li>
    <li><a href="https://github.com/AnSuHan/chrome-extension/tree/main/Tabinet">Source &amp; README</a></li>
  </ul>
</main>
</body>
</html>
